edition = "2024";

package puzzled.v1;

// Proto3 -> Edition 2024 carries identical wire semantics: pin every proto3
// default that moved between representations so the migration is a pure
// edition cutover with no breaking findings and no consumer impact.
option features.field_presence = IMPLICIT;
option features.enum_type = OPEN;
option features.repeated_field_encoding = PACKED;
option features.utf8_validation = VERIFY;
option features.message_encoding = LENGTH_PREFIXED;
option features.json_format = ALLOW;
option features.(pb.cpp).string_type = STRING;

import "google/protobuf/cpp_features.proto";

// Anonymous first-party counters. Signup is server-only. The event name
// selects which of the following fields apply.
message RecordEventRequest {
  string event = 1;
  string path = 2;
  string game_slug = 3;
  string metric = 4;
  double value = 5 [features.field_presence = EXPLICIT];
  string rating = 6;
  string mode = 7;
  string status = 8;
  // Omission means no daily pick; a provided index must be between 1 and 3.
  uint32 pick_index = 9 [features.field_presence = EXPLICIT];
  uint32 time_bucket_s = 10 [features.field_presence = EXPLICIT];
  bool is_guest = 11 [features.field_presence = EXPLICIT];
  uint32 progress_pct_bucket = 12 [features.field_presence = EXPLICIT];
  uint32 hint_count = 13 [features.field_presence = EXPLICIT];
  string action = 14;
  bool has_percentile = 15 [features.field_presence = EXPLICIT];
  string surface = 16;
  uint32 picks_used = 17 [features.field_presence = EXPLICIT];
  string currency = 18;
  string platform = 19;
  string trigger = 20;
  string result = 21;
}
message RecordEventResponse {}
service FunnelService {
  rpc RecordEvent(RecordEventRequest) returns (RecordEventResponse);
}
